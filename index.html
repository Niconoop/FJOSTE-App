<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Pipe Club App</title>
    <link rel="preconnect" href="https://open-pipe-club-backend.nicohertling09.workers.dev" crossorigin />
    <link rel="dns-prefetch" href="https://open-pipe-club-backend.nicohertling09.workers.dev" />
    <script>
      (function() {
        try {
          fetch('https://open-pipe-club-backend.nicohertling09.workers.dev/api/health').catch(function(){});
        } catch(e) {}
      })();
    </script>
    <script>
      (function() {
        function checkOverlay() {
          const isOverlay = window.location.hash.includes('overlay') || window.location.search.includes('overlay');
          if (isOverlay) {
            document.documentElement.classList.add('is-overlay');
            document.documentElement.classList.remove('light');
            document.documentElement.style.setProperty('background', 'transparent', 'important');
            document.documentElement.style.setProperty('background-color', 'transparent', 'important');
            if (document.body) {
              document.body.classList.add('is-overlay-body');
              document.body.style.setProperty('background', 'transparent', 'important');
              document.body.style.setProperty('background-color', 'transparent', 'important');
              document.body.style.setProperty('background-image', 'none', 'important');
            }
          } else {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'light') document.documentElement.classList.add('light');
          }
        }
        checkOverlay();
        window.addEventListener('hashchange', checkOverlay);
        window.addEventListener('DOMContentLoaded', checkOverlay);
        window.addEventListener('load', checkOverlay);
      })();
    </script>
    <style>
      html, body, #root {
        background-color: transparent;
      }
      html.is-overlay,
      html.is-overlay body,
      html.is-overlay #root,
      body.is-overlay-body,
      body.is-overlay-body #root,
      [data-overlay="true"],
      [data-overlay="true"] body,
      [data-overlay="true"] #root {
        background: transparent !important;
        background-color: transparent !important;
        background-image: none !important;
      }
    </style>
  </head>
  <body>
    <script>
      // Run body check again now that body tag is parsed
      if (window.location.hash.includes('overlay') || window.location.search.includes('overlay')) {
        document.body.classList.add('is-overlay-body');
        document.body.style.setProperty('background', 'transparent', 'important');
        document.body.style.setProperty('background-color', 'transparent', 'important');
        document.body.style.setProperty('background-image', 'none', 'important');
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
